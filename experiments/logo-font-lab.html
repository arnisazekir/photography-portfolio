<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OutOfOrder Red Rose Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@300&display=swap">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #181818;
    color: #FAF9F6;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo {
    font-family: 'Red Rose', serif;
    font-weight: 300;
    font-size: 96px;
    letter-spacing: -0.055em;
    line-height: 1;
    color: #FAF9F6;
  }

  .panel {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: grid;
    grid-template-columns: repeat(4, minmax(120px, 1fr));
    gap: 12px;
    padding: 12px;
    background: rgba(0,0,0,0.62);
    border: 1px solid rgba(250,249,246,0.12);
    backdrop-filter: blur(10px);
  }

  label {
    display: grid;
    gap: 5px;
    font: 10px/1.2 system-ui, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(250,249,246,0.68);
  }

  input {
    width: 100%;
    accent-color: #FAF9F6;
  }

  output {
    color: #FAF9F6;
    font-size: 11px;
  }

  .f-fix {
    position: relative;
    display: inline-block;
  }

  .f-fix::after {
    content: "";
    position: absolute;
    left: var(--patch-left, 0.135em);
    top: var(--patch-top, 0.455em);
    width: var(--patch-width, 0.038em);
    height: var(--patch-height, 0.05em);
    background: currentColor;
    border-radius: 0.004em;
    pointer-events: none;
  }

  @media (max-width: 640px) {
    .logo {
      font-size: clamp(44px, 16vw, 64px);
    }
  }
</style>
</head>
<body>
  <div class="logo">OutO<span class="f-fix">f</span>Order</div>
  <div class="panel">
    <label>X <input data-var="left" data-unit="em" type="range" min="0" max="0.34" step="0.001" value="0.135"><output>0.135em</output></label>
    <label>Y <input data-var="top" data-unit="em" type="range" min="0.25" max="0.62" step="0.001" value="0.455"><output>0.455em</output></label>
    <label>Width <input data-var="width" data-unit="em" type="range" min="0" max="0.12" step="0.001" value="0.038"><output>0.038em</output></label>
    <label>Height <input data-var="height" data-unit="em" type="range" min="0" max="0.12" step="0.001" value="0.05"><output>0.05em</output></label>
  </div>
  <script>
    const patch = document.querySelector('.f-fix');
    document.querySelectorAll('[data-var]').forEach(input => {
      const output = input.nextElementSibling;
      const set = () => {
        patch.style.setProperty(`--patch-${input.dataset.var}`, input.value + input.dataset.unit);
        output.textContent = input.value + input.dataset.unit;
      };
      input.addEventListener('input', set);
      set();
    });
  </script>
</body>
</html>
