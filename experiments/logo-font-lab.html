<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OutOfOrder Jost Outline Lab</title>
<style>
  :root { --bg: #181818; --ink: #FAF9F6; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: minmax(54vh, 1fr) auto;
  }
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    overflow: hidden;
  }
  #logoSvg {
    width: min(92vw, 980px);
    height: auto;
    overflow: visible;
    color: var(--ink);
  }
  .glyph-path { fill: currentColor; }
  .panel {
    border-top: 1px solid rgba(250,249,246,0.12);
    background: rgba(0,0,0,0.22);
    padding: 18px 24px 22px;
    max-height: 46vh;
    overflow: auto;
    display: grid;
    gap: 14px;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
  }
  .card {
    border: 1px solid rgba(250,249,246,0.1);
    border-radius: 6px;
    padding: 12px;
    display: grid;
    gap: 9px;
    background: rgba(255,255,255,0.025);
  }
  .card h2 {
    margin: 0 0 2px;
    font-size: 11px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: rgba(250,249,246,0.92);
  }
  label {
    display: grid;
    gap: 5px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(250,249,246,0.58);
  }
  input { width: 100%; accent-color: var(--ink); }
  output {
    color: rgba(250,249,246,0.92);
    font-size: 12px;
    letter-spacing: 0;
    text-transform: none;
  }
  .readout {
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(250,249,246,0.1);
    color: rgba(250,249,246,0.72);
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    padding: 12px;
    white-space: pre-wrap;
  }
</style>
</head>
